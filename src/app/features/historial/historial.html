<div class="card shadow-sm border-0 mb-4">
  <div class="card-body d-flex align-items-center justify-content-between flex-wrap gap-3">
    <h4 class="mb-0 fw-bold">Historial Médico por Mascota</h4>

    <div class="d-flex align-items-center gap-2">
      <label class="form-label mb-0 fw-semibold">Mascota:</label>
      <select
        class="form-select"
        style="width: auto; min-width: 220px;"
        [value]="mascotaSeleccionadaId"
        (change)="onCambioMascota($event)"
      >
        <option *ngFor="let m of mascotas" [value]="m.id">
          {{ m.nombre }} - {{ m.dueno }}
        </option>
      </select>
    </div>
  </div>
</div>

<div *ngIf="historialCitas.length === 0" class="alert alert-info">
  Esta mascota aún no tiene citas ni atenciones registradas.
</div>

<div class="d-flex flex-column gap-3" *ngIf="historialCitas.length > 0">
  <div class="card shadow-sm border-0" *ngFor="let c of historialCitas">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0 fw-bold text-primary">{{ c.motivo }}</h5>
        <span class="fw-semibold">{{ c.estado | estadoCita }}</span>
      </div>

      <p class="text-muted small mb-2">
        📅 {{ c.fecha }} &nbsp;|&nbsp; ⏰ {{ c.hora }}
      </p>

      <div *ngIf="c.diagnostico" class="alert alert-success py-2 mb-2">
        <strong>Diagnóstico / Notas:</strong> {{ c.diagnostico }}
      </div>

      <div class="input-group input-group-sm mt-2">
        <input
          #diagInput
          type="text"
          class="form-control"
          placeholder="Agregar o actualizar diagnóstico..."
          [value]="c.diagnostico || ''"
        />
        <button
          class="btn btn-outline-primary"
          type="button"
          (click)="guardarNota(c.id, diagInput.value)"
        >
          Guardar nota
        </button>
      </div>
    </div>
  </div>
</div>
