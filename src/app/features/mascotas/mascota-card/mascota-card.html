<div class="card h-100 shadow-sm border-0">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="card-title mb-0 fw-bold text-primary">{{ mascota.nombre }}</h5>
      <span class="badge bg-info text-dark">{{ mascota.especie }}</span>
    </div>

    <p class="card-text text-muted small mb-2">
      {{ mascota.obtenerResumen() }}
    </p>

    <ul class="list-unstyled small mb-3">
      <li><strong>Edad:</strong> {{ mascota.edad }} años</li>
      <li><strong>Dueño:</strong> {{ mascota.dueno }}</li>
      <li><strong>Teléfono:</strong> {{ mascota.telefono }}</li>
    </ul>

    <button
      class="btn btn-outline-primary btn-sm w-100"
      (click)="onVerHistorial()"
    >
      Ver historial médico
    </button>
  </div>
</div>
